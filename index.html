
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Coffee Loyalty Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f2eb;
      font-family: Arial, sans-serif;
      color: #2f2924;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 22px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      color: #625b54;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .wallet-button {
      display: block;
      width: 100%;
      padding: 16px 12px;
      border-radius: 8px;
      background: #000;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .note {
      font-size: 12px;
      margin-top: 18px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">☕</div>
    <h1>ABC Coffee</h1>
    <p>
      Join our loyalty program and keep your
      coffee rewards on your phone.
    </p>

    <a
      class="wallet-button"
      href="https://www.youtube.com"
    >
      Add to Google Wallet
    </a>

    <p class="note">
      Tap the button to save your loyalty card.
    </p>
  </main>
</body>
</html>
